name: legal-lexai-dev

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: legal_lexai
      POSTGRES_USER: legal
      POSTGRES_PASSWORD: legal
    ports: ["5432:5432"]
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U legal -d legal_lexai"]
      interval: 5s
      timeout: 3s
      retries: 15

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15

  api:
    build: { context: ./backend, target: development }
    env_file: .env
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+asyncpg://legal:legal@postgres:5432/legal_lexai
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    command: ["sh", "-c", "alembic upgrade head && uvicorn src.api.main:app --host 0.0.0.0 --port 8000 --reload"]
    ports: ["8000:8000"]
    volumes:
      - ./backend:/app
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  worker:
    build: { context: ./backend, target: development }
    env_file: .env
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+asyncpg://legal:legal@postgres:5432/legal_lexai
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    command: ["celery", "-A", "src.api.tasks.celery_app", "worker", "--loglevel=INFO"]
    volumes:
      - ./backend:/app
    depends_on:
      api: { condition: service_started }

  web:
    build: { context: ./frontend, target: development }
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_KEY}
    ports: ["3000:3000"]
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    depends_on:
      api: { condition: service_started }

volumes:
  postgres_dev_data:
  frontend_node_modules:
  frontend_next:
