[project]
name = "legal-ai-backend"
version = "0.1.0"
description = "FastAPI Backend for AI SaaS"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic-settings>=2.1.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "PyJWT>=2.8.0",
    "cryptography>=42.0.0",
    "supabase>=2.3.0",
    "python-multipart>=0.0.9",
    "pymupdf>=1.23.0",
    "pgvector>=0.2.5",
    "fastembed>=0.2.6",
    "litellm>=1.40.0",
    "langgraph>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
